name: better_driver
description: "Enhanced offline-first GPS navigation for Ukraine with anti-jamming, satellite/hybrid maps."
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.5
  sensors_plus: ^4.0.2
  workmanager: ^0.10.10
  flutter_tts: ^3.8.5
  flutter_local_notifications: ^17.2.3
  path_provider: ^2.1.6
  geolocator: ^12.0.0
  permission_handler: ^11.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  equatable: ^2.0.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  xml: ^7.0.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  logger: ^2.8.0
  sentry_flutter: ^10.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_map_geojson: ^1.0.8
  fl_chart: ^1.3.0
  mobile_scanner: ^7.4.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  crypto: ^3.0.6
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/fonts/
